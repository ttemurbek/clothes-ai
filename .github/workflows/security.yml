name: Security smoke checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m compileall -q backend tests
      - name: Check for committed env file
        run: |
          test ! -e .env
          test ! -d uploads
